[package]
name = "stablesave-vault"
version = "0.1.0"
description = "StableSave Solana savings vault: share-based USDC vault with withdrawal limits, timelocks and an emergency pause."
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "stablesave_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.0", default-features = false, features = ["token", "token_2022"] }

[dev-dependencies]
litesvm = "0.17.0"
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
solana-account = "4.3.0"
solana-transaction-error = "3.4"
solana-instruction-error = "2.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
