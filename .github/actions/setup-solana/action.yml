name: Set up Solana build tools
description: Node + pnpm dependencies, Rust cache and the Solana CLI (cargo build-sbf, solana, solana-test-validator).
inputs:
  solana-version:
    description: Agave release channel or version
    default: stable
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install JavaScript dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - uses: Swatinem/rust-cache@v2

    - name: Cache Solana platform tools
      uses: actions/cache@v4
      with:
        path: ~/.cache/solana
        key: solana-platform-tools-${{ runner.os }}-${{ inputs.solana-version }}-v1

    - name: Install Solana CLI
      shell: bash
      run: |
        sh -c "$(curl -sSfL https://release.anza.xyz/${{ inputs.solana-version }}/install)"
        echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
        "$HOME/.local/share/solana/install/active_release/bin/solana" --version
